[workspace]
resolver = "3"
members = ["rust/ffi"]

[workspace.package]
# Single project version. Keep in sync with project(VERSION) in CMakeLists.txt;
# the release workflow checks both against the git tag.
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "warn"

[profile.release]
# Keep line tables so perf / Instruments can attribute samples.
debug = "line-tables-only"
